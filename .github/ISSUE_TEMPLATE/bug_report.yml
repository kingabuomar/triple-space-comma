name: Bug report
description: Report behavior that is reproducible and not security-sensitive.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Triple Space Comma. Never include real typed content or private data.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic example text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Accessibility permission is enabled for Triple Space Comma.
          required: true
        - label: This report contains no sensitive typed content.
          required: true
